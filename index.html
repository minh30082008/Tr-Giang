<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi Trà Giang ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;color:white;
  background:radial-gradient(circle,#5b102d 0%,#220712 45%,#090107 100%);
}
.container{text-align:center;position:relative;z-index:5}
.heart{
  width:140px;height:140px;background:#ff1744;transform:rotate(-45deg);
  margin:0 auto 70px;position:relative;
  animation:beat 1.15s infinite;
  box-shadow:0 0 30px #ff1744,0 0 80px #ff1744;
}
.heart:before,.heart:after{
  content:"";position:absolute;width:140px;height:140px;background:#ff1744;border-radius:50%;
}
.heart:before{top:-70px;left:0}.heart:after{left:70px;top:0}
@keyframes beat{
  0%,100%{transform:rotate(-45deg) scale(1)}
  15%{transform:rotate(-45deg) scale(1.13)}
  30%{transform:rotate(-45deg) scale(1)}
  45%{transform:rotate(-45deg) scale(1.09)}
}
.content{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);width:90vw}
h1{font-size:clamp(32px,6vw,58px);text-shadow:0 0 20px white}
p{font-size:clamp(17px,3vw,24px);margin-top:12px}
button{
  margin-top:24px;padding:13px 28px;border:0;border-radius:30px;
  background:#ff1744;color:#fff;font-size:17px;cursor:pointer;
  box-shadow:0 0 20px #ff1744;transition:.25s;
}
button:hover{transform:scale(1.08)}
.floating{
  position:absolute;bottom:-40px;pointer-events:none;
  animation:up linear forwards;z-index:1;
}
@keyframes up{
  0%{transform:translateY(0) scale(.5) rotate(0);opacity:0}
  10%{opacity:1}90%{opacity:.8}
  100%{transform:translateY(-110vh) scale(1.3) rotate(360deg);opacity:0}
}
#letter{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  z-index:20;align-items:center;justify-content:center;padding:20px;
}
.card{
  max-width:520px;width:100%;padding:35px 28px;border-radius:24px;
  background:linear-gradient(145deg,#fff,#ffe8ef);color:#5b102d;
  text-align:center;box-shadow:0 0 60px #ff1744;
}
.card h2{font-size:30px;margin-bottom:18px}
.card p{line-height:1.7;font-size:18px}
.close{background:#5b102d;box-shadow:none}
</style>
</head>
<body>

<div class="container">
  <div class="heart"></div>
  <div class="content">
    <h1>Gửi Trà Giang, người anh yêu nhất ❤️</h1>
    <p>Một chút yêu thương dành riêng cho em 💕</p>
    <button onclick="openLetter()">Nhấn vào đây 💌</button>
  </div>
</div>

<div id="letter">
  <div class="card">
    <h2>For My Love ❤️</h2>
    <p>
      Cảm ơn em vì đã xuất hiện trong cuộc đời anh.
      <br><br>
      Món quà nhỏ này không có gì đặc biệt,
      nhưng nó chứa rất nhiều tình cảm anh dành cho em.
      <br><br>
      Anh yêu em rất nhiều ❤️
    </p>
    <button class="close" onclick="closeLetter()">Đóng 💕</button>
  </div>
</div>

<script>
const emojis=["❤️","💗","💕","💖","💘","💝","✨"];
function createHeart(){
  const h=document.createElement("div");
  h.className="floating";
  h.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(15+Math.random()*28)+"px";
  const d=4+Math.random()*5;
  h.style.animationDuration=d+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),d*1000);
}
setInterval(createHeart,300);

function openLetter(){
  document.getElementById("letter").style.display="flex";
}
function closeLetter(){
  document.getElementById("letter").style.display="none";
}
</script>
</body>
</html>
